[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automationbench-experiments"
version = "0.1.0"
description = "Muse Spark experiments on AutomationBench with a RELAI custom adapter"
requires-python = ">=3.13"
dependencies = [
    "automation-bench==1.0.6",
    "verifiers==0.2.0",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.3"]

[tool.uv.sources]
automation-bench = { path = "vendor/automation-bench", editable = true }

[project.scripts]
abexp = "automationbench_experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automationbench_experiments"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
